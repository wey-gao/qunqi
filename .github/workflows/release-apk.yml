name: build-apk
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/aichat.keystore
          cd android
          mkdir -p build/classes build/dex
          cp ../server/static/app.html assets/app.html
          aapt2 compile --dir res -o build/res.zip
          aapt2 link -o build/base.apk -I $ANDROID_HOME/platforms/android-34/android.jar \
            --manifest AndroidManifest.xml -R build/res.zip -A assets \
            --min-sdk-version 21 --target-sdk-version 34 --auto-add-overlay
          javac -source 8 -target 8 -encoding UTF-8 -classpath $ANDROID_HOME/platforms/android-34/android.jar \
            -d build/classes $(find src -name '*.java')
          d8 --min-api 21 --lib $ANDROID_HOME/platforms/android-34/android.jar --output build/dex $(find build/classes -name '*.class')
          cp build/base.apk build/unsigned.apk
          cd build && zip -j unsigned.apk dex/classes.dex && zipalign -f 4 unsigned.apk aligned.apk
          apksigner sign --ks aichat.keystore --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASS }} --out ../AI-Chat-${GITHUB_REF_NAME}.apk aligned.apk
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - uses: softprops/action-gh-release@v2
        with:
          files: android/AI-Chat-${{ github.ref_name }}.apk
